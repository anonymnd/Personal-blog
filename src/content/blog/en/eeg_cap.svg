  <circle cx="190" cy="130" r="4" fill="#0066cc"/>
  <text x="195" y="125" font-size="10" fill="#000">C4</text>

  <!-- Parietal -->
  <circle cx="115" cy="165" r="4" fill="#0066cc"/>
  <text x="120" y="160" font-size="10" fill="#000">P3</text>
  <circle cx="150" cy="165" r="4" fill="#0066cc"/>
  <text x="155" y="160" font-size="10" fill="#000">Pz</text>
  <circle cx="185" cy="165" r="4" fill="#0066cc"/>
  <text x="190" y="160" font-size="10" fill="#000">P4</text>

  <!-- Occipital -->
  <circle cx="115" cy="195" r="4" fill="#0066cc"/>
  <text x="120" y="190" font-size="10" fill="#000">O1</text>
  <circle cx="185" cy="195" r="4" fill="#0066cc"/>
  <text x="190" y="190" font-size="10" fill="#000">O2</text>

  <!-- Temporal -->
  <circle cx="65" cy="115" r="4" fill="#0066cc"/>
  <text x="70" y="110" font-size="10" fill="#000">T3</text>
  <circle cx="235" cy="115" r="4" fill="#0066cc"/>
  <text x="240" y="110" font-size="10" fill="#000">T4</text>
  <circle cx="85" cy="175" r="4" fill="#0066cc"/>
