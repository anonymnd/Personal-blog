<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Head outline -->
  <circle cx="150" cy="150" r="100" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Electrodes (10-20 system) -->
  <!-- Frontal pole -->
  <circle cx="115" cy="65" r="4" fill="#0066cc"/>
  <text x="120" y="60" font-size="10" fill="#000">Fp1</text>
  <circle cx="185" cy="65" r="4" fill="#0066cc"/>
  <text x="190" y="60" font-size="10" fill="#000">Fp2</text>

  <!-- Frontal -->
  <circle cx="95" cy="95" r="4" fill="#0066cc"/>
  <text x="100" y="90" font-size="10" fill="#000">F7</text>
  <circle cx="115" cy="85" r="4" fill="#0066cc"/>
  <text x="120" y="80" font-size="10" fill="#000">F3</text>
  <circle cx="150" cy="75" r="4" fill="#0066cc"/>
  <text x="155" y="70" font-size="10" fill="#000">Fz</text>
  <circle cx="185" cy="85" r="4" fill="#0066cc"/>
  <text x="190" y="80" font-size="10" fill="#000">F4</text>
  <circle cx="205" cy="95" r="4" fill="#0066cc"/>
  <text x="210" y="90" font-size="10" fill="#000">F8</text>

  <!-- Central -->
  <circle cx="110" cy="130" r="4" fill="#0066cc"/>
  <text x="115" y="125" font-size="10" fill="#000">C3</text>
  <circle cx="150" cy="130" r="4" fill="#0066cc"/>
